<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">
  <head th:replace="~{fragmentos/head :: head('Muttley System - Cadastrar Assinante')}"></head>
  <body>
    <header th:replace="~{fragmentos/header :: header}" th:with="activePage='Assinante'"></header>

    <main class="container" style="margin-top: 30px; margin-bottom: 50px; font-family: 'Quicksand', sans-serif; display: flex; justify-content: center;">
      <div class="card" style="background: white; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); padding: 30px; width: 100%; max-width: 600px;">

        <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #f0f0f0; padding-bottom: 15px; margin-bottom: 25px;">
          <h2 style="margin: 0; color: #333; display: flex; align-items: center; gap: 10px; font-size: 22px;">
            <i class="fa-solid fa-signature" style="color: #4a90e2"></i>
            <span th:text="${assinante.id != null ? 'Editar Assinante' : 'Novo Assinante'}">Cadastrar</span>
          </h2>
          <a th:href="@{/assinante}" style="color: #666; text-decoration: none; font-size: 14px; font-weight: bold; display: flex; align-items: center; gap: 5px;">
            <i class="fa-solid fa-arrow-left"></i> Voltar
          </a>
        </div>

        <form th:action="@{/assinante/salvar}" th:object="${assinante}" method="post" style="display: flex; flex-direction: column; gap: 20px;">

          <input type="hidden" th:field="*{id}" />

          <div>
            <label for="nome" style="display: block; font-weight: bold; margin-bottom: 8px; color: #555;">Nome Completo</label>
            <input type="text" id="nome" th:field="*{nome}" placeholder="Ex: Prof. Dr. João da Silva" required
              style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-family: inherit;" />
          </div>

          <div>
            <label for="cargo" style="display: block; font-weight: bold; margin-bottom: 8px; color: #555;">Cargo / Função</label>
            <input type="text" id="cargo" th:field="*{cargo}" placeholder="Ex: Coordenador do curso de ADS" required
              style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-family: inherit;" />
          </div>

          <div>
            <label for="instituicao" style="display: block; font-weight: bold; margin-bottom: 8px; color: #555;">Instituição</label>
            <input type="text" id="instituicao" th:field="*{instituicao}" placeholder="Ex: FATEC Zona Leste"
              style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-family: inherit;" />
          </div>

          <div>
            <label style="display: flex; align-items: center; gap: 10px; cursor: pointer;">
              <input type="checkbox" th:field="*{ativo}" style="transform: scale(1.3);" />
              <span style="font-weight: bold; color: #555;">Ativo (disponível para seleção nos eventos)</span>
            </label>
          </div>

          <div style="display: flex; justify-content: flex-end; gap: 12px; margin-top: 15px; border-top: 1px solid #f0f0f0; padding-top: 20px;">
            <a th:href="@{/assinante}" class="btn" style="background-color: #e9ecef; color: #495057; border: 1px solid #ced4da; padding: 10px 20px; border-radius: 4px; text-decoration: none; font-weight: bold; font-family: inherit;">
              Cancelar
            </a>
            <button type="submit" class="btn" style="background-color: #4a90e2; color: white; border: none; padding: 10px 24px; border-radius: 4px; cursor: pointer; font-weight: bold; font-family: inherit;">
              <i class="fa-solid fa-floppy-disk" style="margin-right: 5px"></i> Salvar
            </button>
          </div>
        </form>
      </div>
    </main>

    <footer th:replace="~{fragmentos/footer :: footer}"></footer>
  </body>
</html>
