<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
	<header th:fragment="header">
		<nav class="navbar">
			<div class="navbar-brand">
				<a th:href="@{/}"
					   th:classappend="${activePage == 'inicio'} ? 'active'"
					   id="link-inicio" style="color: white; text-decoration: none; display: flex; align-items: center; gap: 10px;">
					<img th:src="@{/images/logo_muttley.png}" src="/images/logo_muttley.png" alt="Logo Muttley" style="height: 40px; width: auto;">
					Muttley System
				</a>
			</div>
			<ul class="navbar-nav">
				<li class="nav-item">
					<a th:href="@{/}"
					   th:classappend="${activePage == 'inicio'} ? 'active'"
					   id="link-inicio">Início</a>
				</li>
				<li class="nav-item">
					<a th:href="@{/organizador}"
					   th:classappend="${activePage == 'organizadores'} ? 'active'"
					   id="link-organizadores">Organizadores</a>
				</li>
				<li class="nav-item">
					<a th:href="@{/evento}"
					   th:classappend="${activePage == 'eventos'} ? 'active'"
					   id="link-eventos">Eventos</a>
				</li>
				<li class="nav-item">
					<a th:href="@{/pessoa}"
					   th:classappend="${activePage == 'Pessoa'} ? 'active'"
					   id="link-participantes">Participantes</a>
				</li>
				<li class="nav-item">
					<a th:href="@{/certificado}"
					   th:classappend="${activePage == 'certificados'} ? 'active'"
					   id="link-certificados">Certificados</a>
				</li>
				<li class="nav-item">
					<a th:href="@{/medalha}"
					   th:classappend="${activePage == 'Medalha'} ? 'active'"
					   id="link-medalhas">Medalhas</a>
				</li>
				<li class="nav-item">
					<a th:href="@{/competencia}"
					   th:classappend="${activePage == 'Competencia'} ? 'active'"
					   id="link-competencias">Competências</a>
				</li>
			</ul>
		</nav>
	</header>
</body>
</html>
