<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/head :: head('Emitir Certificado')}"></head>
<body>
    <header th:replace="~{fragmentos/header :: header(activePage='Certificado')}"></header>

    <div class="container" style="max-width: 620px;">
        <div class="card shadow-sm">
            <div class="card-header bg-primary text-white">
                <h3 class="card-title mb-0">
                    <span th:if="${certificado.id == null}">Emitir Certificado</span>
                    <span th:unless="${certificado.id == null}">Editar Certificado</span>
                </h3>
            </div>
            <div class="card-body">

                <form th:action="@{/certificado/salvar}" th:object="${certificado}" method="post">

                    <div th:if="${error != null}" class="alert alert-danger">
                        <i class="fa-solid fa-circle-exclamation mr-1"></i> [[${error}]]
                    </div>

                    <input type="hidden" th:field="*{id}" />

                    <div class="form-group mb-3">
                        <label class="form-label">Nome do Certificado</label>
                        <input type="text" th:field="*{nome}" class="form-control"
                               placeholder="Ex: Certificado de Participação" required />
                    </div>

                    <div class="form-group mb-3">
                        <label class="form-label">Nome do Aluno</label>
                        <input type="text" th:field="*{nomeAluno}" class="form-control"
                               placeholder="Nome completo do aluno" required />
                    </div>

                    <div class="form-group mb-3">
                        <label class="form-label">Curso / Evento</label>
                        <input type="text" th:field="*{nomeCurso}" class="form-control"
                               placeholder="Ex: Workshop de Java" required />
                    </div>

                    <div class="form-group mb-3">
                        <label class="form-label">Tema</label>
                        <input type="text" th:field="*{tema}" class="form-control"
                               placeholder="Ex: Desenvolvimento Web com Spring Boot" />
                    </div>

                    <div class="row">
                        <div class="col-md-6">
                            <div class="form-group mb-3">
                                <label class="form-label">Data</label>
                                <input type="date" th:field="*{data}" class="form-control" required />
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group mb-3">
                                <label class="form-label">Carga Horária</label>
                                <input type="text" th:field="*{cargaHoraria}" class="form-control"
                                       placeholder="Ex: 8h" required />
                            </div>
                        </div>
                    </div>

                    <div style="display: flex; gap: 0.75rem; justify-content: flex-end; margin-top: 1.5rem;">
                        <a th:href="@{/certificado}" class="btn btn-secondary">
                            <i class="fa-solid fa-arrow-left"></i> Cancelar
                        </a>
                        <button type="submit" class="btn btn-success">
                            <i class="fa-solid fa-floppy-disk"></i> Salvar
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div th:replace="~{fragmentos/footer :: footer}"></div>
</body>
</html>
