<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragmentos/head :: head('Listagem de Certificados')}"></head>

<body>
    <header th:replace="~{fragmentos/header :: header(activePage='Certificado')}"></header>




    <div class="container" style="max-width: 1000px;">
        <div class="header-crud">
            <h2>Certificados Cadastrados</h2>
             <a th:href="@{/certificado/formulario}" class="btn btn-primary shadow-sm">
                <i class="fa-solid fa-plus mr-1"></i> Novo Certificado
            </a>
        </div>
        <div th:if="${error != null}" class="alert alert-danger alert-dismissible fade show text-center" role="alert">
            <i class="fa-solid fa-circle-exclamation mr-2"></i> [[${error}]]
            <button type="button" class="close" data-dismiss="alert" aria-label="Close">
                <span aria-hidden="true">&times;</span>
            </button>
        </div>

        <div th:if="${!certificados.isEmpty()}" class="card shadow-sm">
            <div class="table-responsive">
                <table class="table table-hover mb-0">
                    <thead class="thead-light">
                        <tr>
                            <th>Nome do Certificado</th>
                            <th>Aluno</th>
                            <th>Curso / Evento</th>
                            <th>Tema</th>
                            <th class="text-center">Data</th>
                            <th class="text-center">Carga Horária</th>
                            <th class="text-center">Ações</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="c : ${certificados}">
                            <td th:text="${c.nome}"></td>
                            <td th:text="${c.nomeAluno}"></td>
                            <td th:text="${c.nomeCurso}"></td>
                            <td th:text="${c.tema}"></td>
                            <td class="text-center" th:text="${#temporals.format(c.data, 'dd/MM/yyyy')}"></td>
                            <td class="text-center" th:text="${c.cargaHoraria}"></td>
                            <td class="text-center">
                                <a th:href="@{'/certificado/gerar/' + ${c.id}}" title="Baixar PDF"
                                    class="text-success mr-3">
                                    <i class="fa-solid fa-file-pdf"></i>
                                </a>
                                <a th:href="@{'/certificado/formulario/' + ${c.id}}" title="Editar"
                                    class="text-primary mr-3">
                                    <i class="fa-regular fa-pen-to-square"></i>
                                </a>
                                <a th:href="@{'/certificado/delete/' + ${c.id}}" title="Excluir" class="text-danger"
                                    onclick="return confirm('Tem certeza que deseja excluir este certificado?')">
                                    <i class="fa-regular fa-trash-can"></i>
                                </a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div th:if="${certificados.isEmpty()}" class="alert alert-info text-center shadow-sm">
            <i class="fa-solid fa-circle-info mr-2"></i> Nenhum certificado emitido até o momento.
        </div>
    </div>

   
</body>

</html>
