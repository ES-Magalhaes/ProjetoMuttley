<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/head :: head('Participantes do Evento')}"></head>
<body>
    <header th:replace="~{fragmentos/header :: header(activePage='Evento')}"></header>

    <div class="container-fluid mt-4" style="max-width: 1400px; padding-left: 15px; padding-right: 15px;">

        <!-- Cabeçalho com info do evento -->
        <div class="d-flex justify-content-between align-items-center mb-3">
            <div>
                <h2 class="mb-0" th:text="${evento.nome}"></h2>
                <small class="text-muted">
                    <i class="fa-regular fa-calendar me-1"></i>
                    <span th:text="${#temporals.format(evento.data, 'dd/MM/yyyy')}"></span>
                    &nbsp;|&nbsp;
                    <i class="fa-solid fa-location-dot me-1"></i>
                    <span th:text="${evento.local}"></span>
                </small>
            </div>
            <a th:href="@{/evento}" class="btn btn-secondary">
                <i class="fa-solid fa-arrow-left me-1"></i> Voltar
            </a>
        </div>

        <!-- Badges de resumo -->
        <div class="mb-3 d-flex gap-2">
            <span class="badge bg-primary fs-6">
                <i class="fa-solid fa-users me-1"></i>
                <span th:text="${inscricoes.size()}"></span> inscritos
            </span>
            <span class="badge bg-success fs-6">
                <i class="fa-solid fa-circle-check me-1"></i>
                <span th:text="${#lists.size(inscricoes.?[presencaConfirmada == true])}"></span> presentes
            </span>
            <span class="badge bg-warning text-dark fs-6">
                <i class="fa-solid fa-clock me-1"></i>
                <span th:text="${#lists.size(inscricoes.?[presencaConfirmada == false])}"></span> pendentes
            </span>
        </div>

        <!-- Tabela de participantes -->
        <div th:if="${!inscricoes.isEmpty()}" class="card shadow-sm">
            <div class="table-responsive">
                <table class="table table-hover mb-0">
                    <thead class="thead-light">
                        <tr>
                            <th>#</th>
                            <th>Nome</th>
                            <th>E-mail</th>
                            <th>CPF</th>
                            <th>Curso</th>
                            <th class="text-center">Presença</th>
                            <th class="text-center">Check-in</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="i, stat : ${inscricoes}">
                            <td th:text="${stat.count}" class="text-muted"></td>
                            <td th:text="${i.participante.nome}" class="font-weight-bold"></td>
                            <td th:text="${i.participante.email}"></td>
                            <td th:text="${i.participante.cpfFormatado}"></td>
                            <td th:text="${i.participante.curso != null ? i.participante.curso : '-'}"></td>
                            <td class="text-center">
                                <span th:if="${i.presencaConfirmada}"
                                      class="badge bg-success">
                                    <i class="fa-solid fa-check me-1"></i> Confirmada
                                </span>
                                <span th:unless="${i.presencaConfirmada}"
                                      class="badge bg-warning text-dark">
                                    <i class="fa-solid fa-clock me-1"></i> Pendente
                                </span>
                            </td>
                            <td class="text-center">
                                <a th:href="@{'/perfil/' + ${i.participante.id}}"
                                   class="btn btn-sm btn-outline-secondary"
                                   title="Ver Perfil"
                                   style="padding: 0.25rem 0.5rem; font-size: 0.875rem;">
                                    <i class="fa-solid fa-user"></i>
                                </a>
                                <a th:unless="${i.presencaConfirmada}"
                                   th:href="@{'/evento/checkin/' + ${i.id}}"
                                   class="btn btn-sm btn-outline-success"
                                   title="Realizar Check-in"
                                   style="padding: 0.25rem 0.5rem; font-size: 0.875rem; margin-left: 4px;"
                                   onclick="return confirm('Confirmar check-in deste participante?')">
                                    <i class="fa-solid fa-circle-check"></i> Check-in
                                </a>
                                <span th:if="${i.presencaConfirmada}" class="text-muted small">
                                    <i class="fa-solid fa-lock"></i> Realizado
                                </span>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div th:if="${inscricoes.isEmpty()}" class="alert alert-info text-center shadow-sm mt-3">
            <i class="fa-solid fa-circle-info me-2"></i> Nenhum participante inscrito neste evento ainda.
        </div>

    </div>

</body>
</html>
