<!doctype html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragmentos/head :: head('Listagem de Eventos')}"></head>
  <body>
    <header
      th:replace="~{fragmentos/header :: header(activePage='Evento')}"
    ></header>

    <div class="container mt-4">
      <div th:if="${message}" class="alert alert-success" style="background:#d4edda;color:#155724;padding:12px 16px;border-radius:6px;margin-bottom:1rem;">
        <i class="fa-solid fa-check-circle"></i> [[${message}]]
      </div>
      <div th:if="${error}" class="alert alert-danger" style="background:#f8d7da;color:#721c24;padding:12px 16px;border-radius:6px;margin-bottom:1rem;">
        <i class="fa-solid fa-circle-exclamation"></i> [[${error}]]
      </div>

      <div class="header-crud">
        <h2>Eventos Cadastrados</h2>
        <a th:href="@{/evento/formulario}" class="btn btn-primary">
          <i class="fa-solid fa-plus col-auto"></i> Novo Evento
        </a>
      </div>

      <div class="card shadow-sm">
        <div class="table-responsive">
          <table class="table table-hover mb-0">
            <thead class="thead-light">
              <tr>
                <th>Nome do Evento</th>
                <th>Categoria</th>
                <th>Modalidade</th>
                <th>Local</th>
                <th>Data</th>
                <th>Vagas</th>
                <th>Organizador</th>
                <th class="text-center">Ações</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="e : ${eventos}">
                <td th:text="${e.nome}" class="font-weight-bold"></td>
                <td th:text="${e.categoria}"></td>
                <td th:text="${e.modalidade}"></td>
                <td th:text="${e.local}"></td>
                <td th:text="${#temporals.format(e.data, 'dd/MM/yyyy')}"></td>
                <td th:text="${e.numeroVagas}"></td>
                <td
                  th:text="${e.organizador != null ? e.organizador.nome : 'Sem Organizador'}"
                ></td>
                <td class="text-center">
                  <a
                    th:href="@{'/evento/qrcode/' + ${e.id}}"
                    class="text-secondary me-3"
                    title="QR Code de Inscrição"
                  >
                    <i class="fa-solid fa-qrcode"></i>
                  </a>
                  <a
                    th:href="@{'/evento/participantes/' + ${e.id}}"
                    class="text-success me-3"
                    title="Ver Participantes"
                  >
                    <i class="fa-solid fa-users"></i>
                  </a>
                  <a
                    th:href="@{'/evento/formulario/' + ${e.id}}"
                    class="text-primary me-3"
                    title="Editar"
                  >
                    <i class="fa-regular fa-pen-to-square"></i>
                  </a>
                  <a
                    th:href="@{'/evento/delete/' + ${e.id}}"
                    class="text-danger"
                    title="Excluir"
                    onclick="return confirm('Deseja excluir este evento?');"
                  >
                    <i class="fa-regular fa-trash-can"></i>
                  </a>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

      <div th:if="${eventos.empty}" class="alert alert-info mt-3 text-center">
        Nenhum evento cadastrado.
      </div>
    </div>

  
  </body>
</html>
