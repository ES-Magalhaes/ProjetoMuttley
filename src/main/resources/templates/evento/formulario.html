<!doctype html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragmentos/head :: head('Formulário de Evento')}"></head>
  <body>
    <header th:replace="~{fragmentos/header :: header(activePage='Evento')}"></header>

    <div class="container mt-4" style="max-width: 700px; margin-bottom: 3rem;">
      <div class="card shadow">
        <div class="card-header bg-primary text-white">
          <h3 class="card-title mb-0"
              th:text="${evento.id == null ? 'Novo Evento' : 'Editar Evento'}"></h3>
        </div>
        <div class="card-body">
          <form th:action="@{/evento/salvar}" th:object="${evento}" method="post">
            <input type="hidden" th:field="*{id}" />

            <div class="form-group mb-3">
              <label class="form-label font-weight-bold">Nome do Evento</label>
              <input type="text" th:field="*{nome}" class="form-control"
                     th:classappend="${#fields.hasErrors('nome')} ? 'is-invalid'"
                     placeholder="Ex: Workshop Spring Boot Avançado" />
              <div class="invalid-feedback" th:errors="*{nome}"></div>
            </div>

            <div class="form-group mb-3">
              <label class="form-label font-weight-bold">Descrição do Evento</label>
              <input type="text" th:field="*{descricao}" class="form-control"
                     th:classappend="${#fields.hasErrors('descricao')} ? 'is-invalid'"
                     placeholder="Ex: Workshop falando sobre aplicação e boas práticas do Spring Boot" />
              <div class="invalid-feedback" th:errors="*{descricao}"></div>
            </div>

            <div class="row">
              <div class="col-md-6">
                <div class="form-group mb-3">
                  <label class="form-label font-weight-bold">Categoria</label>
                  <select th:field="*{categoria}" class="form-control"
                          th:classappend="${#fields.hasErrors('categoria')} ? 'is-invalid'">
                    <option value="">Selecione uma categoria...</option>
                    <option value="Palestra">Palestra</option>
                    <option value="Workshop">Workshop</option>
                    <option value="Curso">Curso</option>
                    <option value="Seminário">Seminário</option>
                    <option value="Congresso">Congresso</option>
                    <option value="Semana Acadêmica">Semana Acadêmica</option>
                    <option value="Treinamento">Treinamento</option>
                    <option value="Extensão">Extensão</option>
                    <option value="Hackathon">Hackathon</option>
                    <option value="Projeto">Projeto</option>
                    <option value="Monitoria">Monitoria</option>
                    <option value="Organização de Evento">Organização de Evento</option>
                  </select>
                  <div class="invalid-feedback" th:errors="*{categoria}"></div>
                </div>
              </div>
              <div class="col-md-6">
                <div class="form-group mb-3">
                  <label class="form-label font-weight-bold">Modalidade</label>
                  <select th:field="*{modalidade}" class="form-control"
                          th:classappend="${#fields.hasErrors('modalidade')} ? 'is-invalid'">
                    <option value="">Selecione uma modalidade...</option>
                    <option value="Presencial">Presencial</option>
                    <option value="Online">Online</option>
                    <option value="Híbrido">Híbrido</option>
                  </select>
                  <div class="invalid-feedback" th:errors="*{modalidade}"></div>
                </div>
              </div>
            </div>

            <div class="form-group mb-3">
              <label class="form-label font-weight-bold">Local / Link</label>
              <input type="text" th:field="*{local}" class="form-control"
                     th:classappend="${#fields.hasErrors('local')} ? 'is-invalid'"
                     placeholder="Ex: Auditório Principal ou URL do Microsoft Teams" />
              <div class="invalid-feedback" th:errors="*{local}"></div>
            </div>

            <div class="row text-start">
              <div class="col-md-6">
                <div class="form-group mb-3">
                  <label class="form-label font-weight-bold">Data</label>
                  <input type="date" th:field="*{data}" class="form-control"
                         th:classappend="${#fields.hasErrors('data')} ? 'is-invalid'" />
                  <div class="invalid-feedback" th:errors="*{data}"></div>
                </div>
              </div>
              <div class="col-md-3">
                <div class="form-group mb-3">
                  <label class="form-label font-weight-bold">Início</label>
                  <input type="time" th:field="*{horaInicio}" class="form-control"
                         th:classappend="${#fields.hasErrors('horaInicio')} ? 'is-invalid'" />
                  <div class="invalid-feedback" th:errors="*{horaInicio}"></div>
                </div>
              </div>
              <div class="col-md-3">
                <div class="form-group mb-3">
                  <label class="form-label font-weight-bold">Fim</label>
                  <input type="time" th:field="*{horaFim}" class="form-control"
                         th:classappend="${#fields.hasErrors('horaFim')} ? 'is-invalid'" />
                  <div class="invalid-feedback" th:errors="*{horaFim}"></div>
                </div>
              </div>
            </div>

            <div class="row">
              <div class="col-md-6">
                <div class="form-group mb-3">
                  <label class="form-label font-weight-bold">Carga Horária (Horas)</label>
                  <input type="number" th:field="*{cargaHoraria}" class="form-control" min="1"
                         th:classappend="${#fields.hasErrors('cargaHoraria')} ? 'is-invalid'"
                         placeholder="Ex: 4" />
                  <div class="invalid-feedback" th:errors="*{cargaHoraria}"></div>
                </div>
              </div>
              <div class="col-md-6">
                <div class="form-group mb-3">
                  <label class="form-label font-weight-bold">Quantidade de Vagas</label>
                  <input type="number" th:field="*{numeroVagas}" class="form-control" min="1"
                         th:classappend="${#fields.hasErrors('numeroVagas')} ? 'is-invalid'"
                         placeholder="Ex: 80" />
                  <div class="invalid-feedback" th:errors="*{numeroVagas}"></div>
                </div>
              </div>
            </div>

            <div class="form-group mb-4">
              <label class="form-label font-weight-bold">Organizador Responsável</label>
              <select th:field="*{organizadorId}" class="form-control"
                      th:classappend="${#fields.hasErrors('organizadorId')} ? 'is-invalid'">
                <option value="">Selecione um organizador...</option>
                <option th:each="o : ${organizadores}"
                        th:value="${o.id}"
                        th:text="${o.nome}"></option>
              </select>
              <div class="invalid-feedback" th:errors="*{organizadorId}"></div>
            </div>

            <!-- Competências do evento -->
            <div class="form-group mb-4">
              <label class="form-label font-weight-bold">Competências Desenvolvidas</label>

              <!-- Campo de pesquisa -->
              <div class="input-group mb-2">
                <span class="input-group-text"><i class="fa-solid fa-magnifying-glass"></i></span>
                <input type="text" id="buscaCompetencia" class="form-control"
                       placeholder="Pesquisar competência..." autocomplete="off" />
              </div>

              <!-- Lista de resultados (só aparece quando digita) -->
              <div id="listaCompetencias" class="border rounded bg-white shadow-sm d-none" style="max-height:180px; overflow-y:auto; position:relative; z-index:10;">
                <div th:each="c : ${todasCompetencias}" class="comp-item d-flex align-items-center justify-content-between px-3 py-2 border-bottom"
                     th:data-nome="${c.nome}" th:data-tipo="${c.tipo.name()}" th:data-id="${c.id}" style="cursor:pointer;">
                  <span th:text="${c.nome}"></span>
                  <i class="fa-solid fa-plus text-success"></i>
                </div>
                <div id="semResultados" class="text-muted text-center py-2 d-none">
                  Nenhum resultado.
                </div>
              </div>

              <!-- Competências selecionadas -->
              <div id="competenciasSelecionadas" class="d-flex flex-wrap gap-2 mt-2"></div>

              <!-- Inputs hidden -->
              <div id="hiddenInputsCompetencias"></div>
            </div>

            <!-- Script de competências -->
            <script th:inline="javascript">
              document.addEventListener('DOMContentLoaded', function() {
                const busca = document.getElementById('buscaCompetencia');
                const lista = document.getElementById('listaCompetencias');
                const items = lista.querySelectorAll('.comp-item');
                const selecionadasDiv = document.getElementById('competenciasSelecionadas');
                const hiddenDiv = document.getElementById('hiddenInputsCompetencias');
                const semResultados = document.getElementById('semResultados');

                const preSelecionados = /*[[${competenciasSelecionadas != null ? competenciasSelecionadas : {}}]]*/ [];
                let selecionados = new Set(preSelecionados.map(id => String(id)));

                function render() {
                  selecionadasDiv.innerHTML = '';
                  hiddenDiv.innerHTML = '';
                  selecionados.forEach(id => {
                    const item = lista.querySelector('.comp-item[data-id="' + id + '"]');
                    if (!item) return;
                    const nome = item.dataset.nome;

                    // Chip com botão remover
                    const chip = document.createElement('span');
                    chip.className = 'badge bg-primary d-inline-flex align-items-center gap-2 py-2 px-3';
                    chip.style.fontSize = '0.85rem';
                    chip.innerHTML = nome +
                      '<i class="fa-solid fa-xmark" style="cursor:pointer;" data-id="' + id + '"></i>';
                    chip.querySelector('.fa-xmark').addEventListener('click', function() {
                      selecionados.delete(this.dataset.id);
                      render();
                    });
                    selecionadasDiv.appendChild(chip);

                    // Hidden input
                    const input = document.createElement('input');
                    input.type = 'hidden';
                    input.name = 'competenciaIds';
                    input.value = id;
                    hiddenDiv.appendChild(input);
                  });
                  filtrar();
                }

                function filtrar() {
                  const termo = busca.value.toLowerCase();
                  let visivel = 0;
                  items.forEach(item => {
                    const jaAdicionado = selecionados.has(item.dataset.id);
                    const matchTermo = item.dataset.nome.toLowerCase().includes(termo);
                    const mostrar = !jaAdicionado && matchTermo;
                    item.style.display = mostrar ? '' : 'none';
                    if (mostrar) visivel++;
                  });
                  semResultados.classList.toggle('d-none', visivel > 0);
                }

                // Mostra lista ao focar/digitar
                busca.addEventListener('focus', function() {
                  lista.classList.remove('d-none');
                  filtrar();
                });
                busca.addEventListener('input', function() {
                  lista.classList.remove('d-none');
                  filtrar();
                });

                // Esconde lista ao clicar fora
                document.addEventListener('click', function(e) {
                  if (!busca.contains(e.target) && !lista.contains(e.target)) {
                    lista.classList.add('d-none');
                  }
                });

                // Adicionar ao clicar no item
                items.forEach(item => {
                  item.addEventListener('click', function() {
                    selecionados.add(this.dataset.id);
                    busca.value = '';
                    render();
                  });
                });

                // Inicializar
                render();
              });
            </script>

            <div class="d-flex justify-content-end border-top pt-3">
              <a th:href="@{/evento}" class="btn btn-secondary me-2">Cancelar</a>
              <button type="submit" class="btn btn-success">
                <i class="fa-solid fa-floppy-disk me-1"></i> Salvar Evento
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <div th:replace="~{fragmentos/footer :: footer}"></div>
  </body>
</html>
