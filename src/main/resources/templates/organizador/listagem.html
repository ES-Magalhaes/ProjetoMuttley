<!doctype html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
  <head
    th:replace="~{fragmentos/head :: head('Gestão de Organizadores')}"
  ></head>
  <body>
    <header
      th:replace="~{fragmentos/header :: header(activePage='organizadores')}"
    ></header>

    <div class="container">
      <div th:if="${message}" class="alert alert-success">[[${message}]]</div>
      <div th:if="${error}" class="alert alert-danger">[[${error}]]</div>

      <div
        class="hero-section"
        th:style="'background-image: url(' + @{/images/palestrante.png} + ');'"
      >
        <div class="hero-content">
          <h1>Gestão de Organizadores</h1>
          <p>Administre os organizadores de eventos no sistema Muttley.</p>
        </div>
      </div>

      <div class="header-crud">
        <h2>Organizadores Cadastrados</h2>
        <a th:href="@{/organizador/formulario}" class="btn">
          <i class="fa-solid fa-circle-plus"></i> Novo Organizador
        </a>
      </div>

      <div th:if="${organizadores != null and !#lists.isEmpty(organizadores)}">
        <table>
          <thead>
            <tr>
              <th>Nome</th>
              <th>Área de Atuação</th>
              <th>Instituição</th>
              <th>Mini Currículo</th>
              <th class="text-center">Ações</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="org : ${organizadores}">
              <td th:text="${org.nome}"></td>
              <td th:text="${org.areaAtuacao}"></td>
              <td th:text="${org.instituicao}"></td>
              <td th:text="${org.miniCurriculo}"></td>
              <td class="text-center">
                <a
                  th:href="@{/organizador/formulario(id=${org.id})}"
                  class="text-primary mr-3"
                  title="Editar"
                >
                  <i class="fa-regular fa-pen-to-square"></i>
                </a>
                <a
                  th:href="@{'/organizador/delete/' + ${org.id}}"
                  class="text-danger"
                  title="Excluir"
                  onclick="return confirm('Excluir este organizador?');"
                >
                  <i class="fa-regular fa-trash-can"></i>
                </a>
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <div
        th:unless="${organizadores != null and !#lists.isEmpty(organizadores)}"
        class="alert alert-info"
      >
        Nenhum organizador cadastrado ainda.
      </div>
    </div>

    <div th:replace="~{fragmentos/footer :: footer}"></div>
  </body>
</html>
