<!doctype html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
  <head
    th:replace="~{fragmentos/head :: head('Formulário de Organizador')}"
  ></head>
  <body>
    <header
      th:replace="~{fragmentos/header :: header(activePage='organizadores')}"
    ></header>

    <div
      class="container"
      style="max-width: 620px; margin-top: 2rem; margin-bottom: 2rem"
    >
      <div class="card shadow-sm">
        <div class="card-header bg-primary text-white">
          <h3
            class="card-title mb-0"
            th:text="${organizador.id != null} ? 'Editar Organizador' : 'Novo Organizador'"
          >
            Formulário
          </h3>
        </div>
        <div class="card-body">
          <form
            th:action="@{/organizador/salvar}"
            th:object="${organizador}"
            method="post"
          >
            <input type="hidden" th:field="*{id}" />

            <div class="mb-3">
              <label class="form-label">Nome Completo</label>
              <input
                type="text"
                th:field="*{nome}"
                class="form-control"
                th:classappend="${#fields.hasErrors('*{nome}')} ? 'is-invalid'"
              />
              <div class="invalid-feedback" th:errors="*{nome}"></div>
            </div>

            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label">CPF</label>
                <input
                  type="text"
                  th:field="*{cpf}"
                  class="form-control"
                  th:classappend="${#fields.hasErrors('*{cpf}')} ? 'is-invalid'"
                />
                <div class="invalid-feedback" th:errors="*{cpf}"></div>
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label">E-mail</label>
                <input
                  type="email"
                  th:field="*{email}"
                  class="form-control"
                  th:classappend="${#fields.hasErrors('*{email}')} ? 'is-invalid'"
                />
                <div class="invalid-feedback" th:errors="*{email}"></div>
              </div>
            </div>

            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label">Formação Acadêmica</label>
                <input
                  type="text"
                  th:field="*{formacao}"
                  class="form-control"
                  th:classappend="${#fields.hasErrors('*{formacao}')} ? 'is-invalid'"
                  placeholder="Ex: Mestre em Computação"
                />
                <div class="invalid-feedback" th:errors="*{formacao}"></div>
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label">Área de Atuação</label>
                <input
                  type="text"
                  th:field="*{areaAtuacao}"
                  class="form-control"
                  th:classappend="${#fields.hasErrors('*{areaAtuacao}')} ? 'is-invalid'"
                  placeholder="Ex: Desenvolvimento Web"
                />
                <div class="invalid-feedback" th:errors="*{areaAtuacao}"></div>
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label">Instituição / Empresa</label>
              <input
                type="text"
                th:field="*{instituicao}"
                class="form-control"
                th:classappend="${#fields.hasErrors('*{instituicao}')} ? 'is-invalid'"
                placeholder="Ex: FATEC Zona Leste"
              />
              <div class="invalid-feedback" th:errors="*{instituicao}"></div>
            </div>

            <div class="mb-3">
              <label class="form-label">URL do LinkedIn (Opcional)</label>
              <input type="url" th:field="*{linkedin}" class="form-control" />
            </div>

            <div class="mb-3">
              <label class="form-label">Mini Currículo</label>
              <textarea
                th:field="*{miniCurriculo}"
                class="form-control"
                rows="3"
                th:classappend="${#fields.hasErrors('*{miniCurriculo}')} ? 'is-invalid'"
                placeholder="Breve resumo das experiências profissionais..."
              ></textarea>
              <div class="invalid-feedback" th:errors="*{miniCurriculo}"></div>
            </div>

            <div class="d-flex gap-2 justify-content-end mt-4">
              <a th:href="@{/organizador}" class="btn btn-secondary">
                <i class="fa-solid fa-arrow-left"></i> Cancelar
              </a>
              <button type="submit" class="btn btn-success">
                <i class="fa-solid fa-floppy-disk"></i> Salvar Organizador
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <div th:replace="~{fragmentos/footer :: footer}"></div>
  </body>
</html>
