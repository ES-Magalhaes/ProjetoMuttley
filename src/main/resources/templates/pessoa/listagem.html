<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/head :: head('Participantes')}"></head>
<body>
<header th:replace="~{fragmentos/header :: header(activePage='Pessoa')}"></header>

<div class="container mt-4">
    <div th:if="${erro}" style="background:#f8d7da;color:#721c24;padding:12px 16px;border-radius:6px;margin-bottom:1rem;">
        <i class="fa-solid fa-circle-exclamation"></i> [[${erro}]]
    </div>

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Participantes Cadastrados</h2>
        <a th:href="@{/pessoa/formulario}" class="btn btn-primary">
            <i class="fa-solid fa-plus me-1"></i> Novo Participante
        </a>
    </div>

    <div th:if="${!pessoas.isEmpty()}" class="card shadow-sm">
        <div class="table-responsive">
            <table class="table table-hover mb-0">
                <thead class="thead-light">
                    <tr>
                        <th>Nome</th>
                        <th>E-mail</th>
                        <th>CPF</th>
                        <th>RA</th>
                        <th>Curso</th>
                        <th class="text-center">Ações</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="p : ${pessoas}">
                        <td th:text="${p.nome}" class="fw-semibold"></td>
                        <td th:text="${p.email}"></td>
                        <td th:text="${p.cpf != null and p.cpf.length() == 11 ?
                            p.cpf.substring(0,3) + '.' + p.cpf.substring(3,6) + '.' +
                            p.cpf.substring(6,9) + '-' + p.cpf.substring(9) : p.cpf}"></td>
                        <td th:text="${p.ra != null ? p.ra : '-'}"></td>
                        <td th:text="${p.curso != null ? p.curso : '-'}"></td>
                        <td class="text-center">
                            <a th:href="@{'/perfil/' + ${p.id}}"
                               class="text-success me-2" title="Ver Perfil">
                                <i class="fa-solid fa-user-graduate"></i>
                            </a>
                            <a th:href="@{'/pessoa/formulario/' + ${p.id}}"
                               class="text-primary me-2" title="Editar">
                                <i class="fa-regular fa-pen-to-square"></i>
                            </a>
                            <a th:href="@{'/pessoa/delete/' + ${p.id}}"
                               class="text-danger" title="Excluir"
                               onclick="return confirm('Excluir este participante?')">
                                <i class="fa-regular fa-trash-can"></i>
                            </a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div th:if="${pessoas.isEmpty()}" class="alert alert-info text-center mt-3">
        <i class="fa-solid fa-circle-info me-2"></i> Nenhum participante cadastrado ainda.
    </div>
</div>

<div th:replace="~{fragmentos/footer :: footer}"></div>
</body>
</html>
