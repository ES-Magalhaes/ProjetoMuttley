<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragmentos/head :: head('Inscrição no Evento')}"></head>
  <body>
    <header th:replace="~{fragmentos/header :: header}"></header>

    <main class="container mt-5" style="max-width: 600px">
      <div class="card shadow-sm">
        <div class="card-header bg-primary text-white">
          <h3 class="card-title mb-0">
            Inscrição — <span th:text="${evento.nome}"></span>
          </h3>
        </div>
        <div class="card-body">

          <div th:if="${erro}" class="alert alert-danger" th:text="${erro}"></div>

          <!-- Bloco "Já participei" -->
          <div class="alert alert-light border mb-4">
            <p class="mb-2 fw-semibold">
              <i class="fa-solid fa-rotate-left me-1 text-primary"></i>
              Já participou de outras palestras?
            </p>
            <div class="input-group">
              <input type="text" id="cpfBusca" class="form-control"
                     placeholder="000.000.000-00"
                     maxlength="14" />
              <button type="button" class="btn btn-outline-primary" onclick="buscarPorCpf()">
                <i class="fa-solid fa-magnifying-glass me-1"></i> Preencher automaticamente
              </button>
            </div>
            <div id="msgBusca" class="mt-2 small"></div>
          </div>

          <!-- Formulário principal -->
          <form th:action="@{/evento/inscrever/{id}(id=${evento.id})}" method="post" id="formInscricao">

            <div class="mb-3">
              <label for="nome" class="form-label">Nome Completo</label>
              <input type="text" id="nome" name="nome" class="form-control" required />
            </div>

            <div class="mb-3">
              <label for="cpf" class="form-label">CPF</label>
              <input type="text" id="cpf" name="cpf" class="form-control"
                     placeholder="000.000.000-00" maxlength="14" required />
            </div>

            <div class="row">
              <div class="col-md-6 mb-3">
                <label for="ra" class="form-label">RA (Registro Acadêmico)</label>
                <input type="text" id="ra" name="ra" class="form-control" />
              </div>
              <div class="col-md-6 mb-3">
                <label for="curso" class="form-label">Curso</label>
                <input type="text" id="curso" name="curso" class="form-control"
                       placeholder="Ex: DSM, GE, LOG" />
              </div>
            </div>

            <div class="mb-3">
              <label for="email" class="form-label">E-mail</label>
              <input type="email" id="email" name="email" class="form-control"
                     placeholder="nome@fatec.sp.gov.br" required />
            </div>

            <div class="mb-3">
              <label for="telefone" class="form-label">Telefone / WhatsApp</label>
              <input type="text" id="telefone" name="telefone" class="form-control"
                     placeholder="(11) 99999-9999" />
            </div>

            <div class="d-grid gap-2 mt-4">
              <button type="submit" class="btn btn-success btn-lg">
                <i class="fa-solid fa-check me-1"></i> Confirmar Inscrição
              </button>
              <a th:href="@{/evento}" class="btn btn-light">Voltar para Eventos</a>
            </div>
          </form>
        </div>
      </div>
    </main>

    <footer th:replace="~{fragmentos/footer :: footer}"></footer>

    <script>
      // Máscara de CPF: 000.000.000-00
      function mascaraCpf(valor) {
        return valor
          .replace(/\D/g, '')
          .replace(/(\d{3})(\d)/, '$1.$2')
          .replace(/(\d{3})(\d)/, '$1.$2')
          .replace(/(\d{3})(\d{1,2})$/, '$1-$2');
      }

      document.getElementById('cpf').addEventListener('input', function () {
        this.value = mascaraCpf(this.value);
      });

      document.getElementById('cpfBusca').addEventListener('input', function () {
        this.value = mascaraCpf(this.value);
      });

      // Busca pessoa pelo CPF e preenche o formulário
      function buscarPorCpf() {
        const cpfFormatado = document.getElementById('cpfBusca').value;
        const cpfLimpo = cpfFormatado.replace(/\D/g, '');
        const msg = document.getElementById('msgBusca');

        if (cpfLimpo.length !== 11) {
          msg.innerHTML = '<span class="text-danger">Digite um CPF válido com 11 dígitos.</span>';
          return;
        }

        fetch('/pessoa/buscar-cpf?cpf=' + cpfLimpo)
          .then(res => {
            if (!res.ok) throw new Error('Não encontrado');
            return res.json();
          })
          .then(p => {
            document.getElementById('nome').value     = p.nome     || '';
            document.getElementById('cpf').value      = cpfFormatado;
            document.getElementById('email').value    = p.email    || '';
            document.getElementById('ra').value       = p.ra       || '';
            document.getElementById('curso').value    = p.curso    || '';
            document.getElementById('telefone').value = p.telefone || '';
            msg.innerHTML = '<span class="text-success"><i class="fa-solid fa-check me-1"></i>Dados preenchidos com sucesso!</span>';
          })
          .catch(() => {
            msg.innerHTML = '<span class="text-warning"><i class="fa-solid fa-triangle-exclamation me-1"></i>CPF não encontrado. Preencha os dados manualmente.</span>';
          });
      }
    </script>
  </body>
</html>
