<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragmentos/head :: head('Inscrição no Evento')}"></head>
  <body>
    <header th:replace="~{fragmentos/header :: header}"></header>

    <main class="container mt-5" style="max-width: 600px">
      <div class="card shadow-sm">
        <div class="card-header bg-primary text-white">
          <h3 class="card-title mb-0">Inscrição no Evento</h3>
        </div>
        <div class="card-body">
          <div
            th:if="${erro}"
            class="alert alert-danger"
            th:text="${erro}"
          ></div>

          <form
            th:action="@{/evento/inscrever/{id}(id=${evento.id})}"
            method="post"
          >
            <div class="mb-3">
              <label for="nome" class="form-label">Nome Completo</label>
              <input
                type="text"
                id="nome"
                name="nome"
                class="form-content form-control"
                required
              />
            </div>

            <div class="mb-3">
              <label for="cpf" class="form-label">CPF</label>
              <input
                type="text"
                id="cpf"
                name="cpf"
                class="form-content form-control"
                placeholder="000.000.000-00"
                required
              />
            </div>

            <div class="row">
              <div class="col-md-6 mb-3">
                <label for="ra" class="form-label"
                  >RA (Registro Acadêmico)</label
                >
                <input
                  type="text"
                  id="ra"
                  name="ra"
                  class="form-content form-control"
                  required
                />
              </div>
              <div class="col-md-6 mb-3">
                <label for="curso" class="form-label">Curso</label>
                <input
                  type="text"
                  id="curso"
                  name="curso"
                  class="form-content form-control"
                  placeholder="Ex: DSM, GE, log"
                  required
                />
              </div>
            </div>

            <div class="mb-3">
              <label for="email" class="form-label">E-mail</label>
              <input
                type="email"
                id="email"
                name="email"
                class="form-content form-control"
                placeholder="nome@fatec.sp.gov.br"
                required
              />
            </div>

            <div class="mb-3">
              <label for="telefone" class="form-label"
                >Telefone / WhatsApp</label
              >
              <input
                type="text"
                id="telefone"
                name="telefone"
                class="form-content form-control"
                placeholder="(11) 99999-9999"
                required
              />
            </div>

            <div class="d-grid gap-2 mt-4">
              <button type="submit" class="btn btn-success btn-lg">
                Confirmar Inscrição
              </button>
              <a th:href="@{/evento}" class="btn btn-light"
                >Voltar para Eventos</a
              >
            </div>
          </form>
        </div>
      </div>
    </main>

    <footer th:replace="~{fragmentos/footer :: footer}"></footer>
  </body>
</html>
